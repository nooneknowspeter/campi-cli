brand: ./branding/brand.yaml

project:
  type: website
  output-dir: _output
  render:
    - index.qmd
    - docs/*.md
    - CONTRIBUTING.md
    - SECURITY.md
    - SUPPORT.md
  resources:
    - branding/_vendor
  preview:
    host: 0.0.0.0
    port: 4010
    browser: false

website:
  title: campi cli
  sidebar:
    contents:
      - index.qmd
      - section: Documentation
        contents:
          - docs/installation.md
          - docs/usage.md
          - docs/commands.md
          - docs/development.md
      - section: Project
        contents:
          - CONTRIBUTING.md
          - SECURITY.md
          - SUPPORT.md
  bread-crumbs: true
  page-navigation: true

format:
  html:
    toc: true
    embed-resources: false
    include-after-body: branding/src/mermaid/load.html
  typst:
    toc: true
    number-sections: true
    papersize: us-letter
    margin:
      x: 0.75in
      y: 0.9in
    template-partials:
      - branding/src/typst/typst-template.typ
    filters:
      - branding/filters/mermaid-pdf.lua
