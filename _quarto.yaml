brand: ./branding/brand.yaml

project:
  type: website
  output-dir: _output
  render:
    - index.qmd
    - docs/*.md
    - CONTRIBUTING.md
    - SECURITY.md
    - SUPPORT.md
  preview:
    host: 0.0.0.0
    port: 4010
    browser: false

website:
  title: campi cli
  sidebar:
    contents:
      - index.qmd
      - section: Documentation
        contents:
          - docs/installation.md
          - docs/usage.md
          - docs/commands.md
          - docs/development.md
      - section: Project
        contents:
          - CONTRIBUTING.md
          - SECURITY.md
          - SUPPORT.md
  bread-crumbs: true
  page-navigation: true

format:
  html:
    toc: true
    embed-resources: true
